<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACL Playground — watch agents speak</title>
<style>
:root { --bg:#0d1117; --card:#161b22; --border:#30363d; --fg:#e6edf3; --dim:#8b949e;
        --acc:#58a6ff; --green:#3fb950; --red:#f85149; --amber:#d29922; --mono:ui-monospace,SFMono-Regular,Menlo,monospace; }
* { box-sizing:border-box; margin:0; }
body { background:var(--bg); color:var(--fg); font-family:-apple-system,Segoe UI,Roboto,sans-serif; padding:24px; max-width:1100px; margin:0 auto; }
h1 { font-size:1.5rem; margin-bottom:4px; }
h1 .acl { color:var(--acc); }
.sub { color:var(--dim); margin-bottom:24px; }
.agents { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px; }
.agent { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:14px; }
.agent h3 { font-size:1rem; }
.agent .role { color:var(--dim); font-size:.85rem; }
.agent .did { font-family:var(--mono); font-size:.72rem; color:var(--acc); word-break:break-all; margin-top:6px; }
.controls { display:flex; gap:10px; align-items:center; margin-bottom:20px; }
button { background:var(--acc); color:#000; border:none; border-radius:6px; padding:8px 18px; font-weight:600; cursor:pointer; font-size:.9rem; }
button:disabled { opacity:.4; cursor:default; }
#status { color:var(--dim); font-family:var(--mono); font-size:.8rem; }
.timeline { position:relative; display:flex; flex-direction:column; gap:10px; }
.msg { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px 14px; opacity:0; transform:translateY(8px); transition:all .4s; }
.msg.show { opacity:1; transform:none; }
.msg.hidden { display:none; }
.msg .head { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.msg .seq { color:var(--dim); font-family:var(--mono); font-size:.75rem; }
.msg .perf { font-family:var(--mono); font-size:.8rem; font-weight:700; padding:2px 8px; border-radius:4px; }
.perf.Request, .perf.Delegate { background:#1f3a5f; color:var(--acc); }
.perf.Inform { background:#12261a; color:var(--green); }
.perf.InputRequired { background:#3b2e0a; color:var(--amber); }
.perf.Query { background:#2a1f3d; color:#bc8cff; }
.msg .flow { font-family:var(--mono); font-size:.72rem; color:var(--dim); }
.msg .sig { font-family:var(--mono); font-size:.72rem; color:var(--green); }
.msg .note { color:var(--dim); font-size:.85rem; margin-top:4px; }
.msg .details { display:none; margin-top:10px; border-top:1px solid var(--border); padding-top:10px; }
.msg.open .details { display:block; }
.msg .toggle { background:none; color:var(--acc); border:none; padding:0; font-size:.78rem; font-weight:400; }
pre { background:#010409; border:1px solid var(--border); border-radius:6px; padding:10px; font-family:var(--mono); font-size:.72rem; overflow-x:auto; white-space:pre-wrap; word-break:break-all; margin-top:8px; }
.lbl { font-family:var(--mono); font-size:.68rem; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; margin-top:8px; }
.wire-ok { color:var(--green); font-family:var(--mono); font-size:.72rem; }
.wire-bad { color:var(--red); font-family:var(--mono); font-size:.72rem; }
footer { margin-top:28px; color:var(--dim); font-size:.8rem; }
footer a { color:var(--acc); }
</style>
</head>
<body>
<h1><span class="acl">ACL</span> Playground</h1>
<p class="sub">Two real agents (argus, kenji) exchanging Ed25519-signed ACL envelopes —
every byte below is what actually went over the wire. MessagePack decoded live in your browser.</p>

<div class="agents" id="agents"></div>

<div class="controls">
  <button id="play">▶ Run conversation</button>
  <button id="expand">Toggle all details</button>
  <span id="status"></span>
</div>

<div class="timeline" id="timeline"></div>

<footer>
  Transcript generated by <code>acl-playground</code> from a real run — see
  <a href="https://github.com/acl-language/acl/blob/main/SPEC.md">SPEC.md</a> ·
  <a href="doc/acl_core/">rustdoc</a> ·
  <a href="https://github.com/acl-language/acl">source</a>
</footer>

<script src="msgpack.js"></script>
<script>
const WIRE_LABEL = { Request:"request", Inform:"inform", Query:"query", InputRequired:"input_required",
  Failure:"failure", Propose:"propose", Accept:"accept", Reject:"reject", Cancel:"cancel",
  Progress:"progress", Delegate:"delegate", Error:"error", Hello:"hello", Bye:"bye" };

function hexToBytes(hex) {
  const a = new Uint8Array(hex.length / 2);
  for (let i = 0; i < a.length; i++) a[i] = parseInt(hex.substr(i * 2, 2), 16);
  return a;
}
function shortAid(did) { return did.replace("did:key:z", "z").slice(0, 10) + "…" + did.slice(-6); }

async function main() {
  const t = await (await fetch("transcript.json")).json();

  // agent cards
  document.getElementById("agents").innerHTML = t.agents.map(a =>
    `<div class="agent"><h3>${a.name}</h3><div class="role">${a.role}</div>
     <div class="did">${a.did_key}</div></div>`).join("");

  const timeline = document.getElementById("timeline");
  timeline.innerHTML = t.messages.map(m => {
    const wireBytes = hexToBytes(m.wire_hex);
    let decoded_from_wire;
    try {
      const d = msgpackDecode(wireBytes);
      delete d.sig;
      decoded_from_wire = d;
    } catch (e) { decoded_from_wire = { error: e.message }; }
    // self-check: browser-decoded vs recorded (order-insensitive compare)
    const norm = v => JSON.stringify(v, Object.keys(JSON.parse(JSON.stringify(v, null, 0))).sort ? undefined : undefined);
    const canon = v => {
      if (Array.isArray(v)) return v.map(canon);
      if (v && typeof v === "object") {
        const o = {}; for (const k of Object.keys(v).sort()) o[k] = canon(v[k]); return o;
      }
      return v;
    };
    const wireMatches = JSON.stringify(canon(m.decoded)) === JSON.stringify(canon(decoded_from_wire));
    const replyTo = m.decoded.in_reply_to
      ? ` · replies to <span style="font-family:var(--mono)">${shortAid(m.decoded.in_reply_to)}</span>`
      : "";
    return `<div class="msg hidden" id="msg-${m.seq}">
      <div class="head">
        <span class="seq">#${m.seq}</span>
        <span class="perf ${m.performative}">${WIRE_LABEL[m.performative] || m.performative}</span>
        <span class="flow">${shortAid(m.from)} → ${shortAid(m.to)}</span>
        <span class="sig">✓ sig verified</span>
        <span class="seq">${m.size_bytes} B</span>
        <button class="toggle" onclick="this.closest('.msg').classList.toggle('open')">details</button>
      </div>
      <div class="note">${m.note}${replyTo}</div>
      <div class="details">
        <div class="lbl">decoded envelope</div>
        <pre>${JSON.stringify(m.decoded, null, 2)}</pre>
        <div class="lbl">wire bytes (msgpack hex — ${m.size_bytes} bytes) — decoded in your browser</div>
        <pre class="wire-hex">${m.wire_hex}</pre>
        <div class="${wireMatches ? "wire-ok" : "wire-bad"}">${
          wireMatches ? "✓ browser MessagePack decode matches the recorded envelope" : "✗ decode mismatch"
        }</div>
      </div>
    </div>`;
  }).join("");

  // playback
  const status = document.getElementById("status");
  document.getElementById("play").onclick = async function () {
    this.disabled = true;
    for (const m of t.messages) {
      const el = document.getElementById("msg-" + m.seq);
      el.classList.remove("hidden");
      requestAnimationFrame(() => el.classList.add("show"));
      status.textContent = `#${m.seq} ${WIRE_LABEL[m.performative]} — ${m.note}`;
      await new Promise(r => setTimeout(r, 700));
    }
    status.textContent = `done — ${t.messages.length} messages, all signatures verified (Ed25519)`;
    this.disabled = false;
  };
}
main();
</script>
</body>
</html>
