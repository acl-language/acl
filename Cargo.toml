[package]
name = "acl-core"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3.0.0"
rand = "0.10.3"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
serde_repr = "0.1.21"
sha1 = "0.11.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

[dev-dependencies]
serde_json = "1.0.154"
