name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build rustdoc
        run: cargo doc --no-deps
      - name: Build playground + discovery generators
        run: cargo build --bin playground --bin aclc --bin acl_discover
      - name: Assemble site
        run: |
          mkdir -p site/doc site/playground
          cp -r target/doc/* site/doc/
          ./target/debug/playground site/playground/transcript.json
          cp docs/playground/index.html site/playground/
          cp docs/playground/msgpack.js site/playground/
          cp docs/site-index.html site/index.html
          ./target/debug/acl_discover site "https://acl-language.github.io/acl/"
          cp llms.txt site/
          cp llms.txt site/.well-known/llms.txt
          echo "<meta http-equiv=\"refresh\" content=\"0;url=doc/acl_core/index.html\">" > site/doc/index.html
      - name: Validate playground transcript
        run: |
          python3 -c "
          import json
          t = json.load(open('site/playground/transcript.json'))
          assert len(t['messages']) == 8
          assert all(m['sig_verified'] for m in t['messages'])
          print('transcript ok:', len(t['messages']), 'messages, all verified')"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
